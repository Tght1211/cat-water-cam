<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 喵喵水站</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#e9f2f9;background:#080f19}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#133343 0%,#080f19 65%)}.login{width:100%;max-width:380px;background:#101c2c;border:1px solid #223749;border-radius:22px;padding:32px;box-shadow:0 20px 70px #0004}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#153e4c;color:#35cdec;font-size:25px}h1{font-size:23px;margin:22px 0 8px}p{font-size:13px;line-height:1.7;color:#8ba3b5;margin:0 0 24px}label{display:block;font-size:13px;margin-bottom:8px}input{width:100%;border:1px solid #2a4257;background:#0a1422;color:#e9f2f9;border-radius:10px;padding:13px;font:inherit;outline:none}input:focus{border-color:#35cdec}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:18px;background:#24b9d2;color:#061820;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#error{font-size:12px;color:#ff8b90;min-height:18px;margin-top:12px}.foot{margin:20px 0 0;font-size:11px;color:#64798c}
</style></head><body><main class="login"><div class="mark">🐱</div><h1>喵喵水站</h1><p>输入访问密码，查看小猫的饮水记录和实时画面。</p><form id="loginForm"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required autofocus><button id="submit" type="submit">进入水站</button><div id="error" role="alert"></div></form><p class="foot">共享设备使用完毕后，请退出登录。</p></main><script>
document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#submit'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const result=await response.json();if(response.ok)location.replace('/');else error.textContent=result.detail||'登录失败';}catch(e){error.textContent='连接失败，请重试';}finally{button.disabled=false;}});
</script></body></html>
